name: Build and submit Open Aqua to TestFlight

on:
  workflow_dispatch:

jobs:
  build_ios:
    name: Build signed iOS candidate
    type: build
    params:
      platform: ios
      profile: production

  submit_ios:
    name: Submit candidate to TestFlight
    needs: [build_ios]
    type: testflight
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
